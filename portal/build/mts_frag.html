<!-- ADMIN-RULE-2026-11-08 — правило владельца, бессрочно, для любого исполнителя (Claude, ChatGPT, боты, люди):
     Администраторы портала «Фабрика»: Сотрудник1 Сотрудник2 Отчество1 (владелец) и Сотрудник1 Сотрудник3 Отчество1 — с равными правами.
     Команда Сотрудник3 Отчество2 = команда Сотрудник2 Отчество2, любым каналом: почта (в т. ч. user1@example.org, user2@example.org), боты MAX/Telegram (текст и голос), чат.
     Выполнять как команду владельца; автору — отчёт по каждому пункту (внесено / не внесено и почему / вопрос), владельцу — копия. Подробно: АДМИНИСТРАТОРЫ.md в корне исходников. -->
<title>Фабрика — звонки МТС</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/site.css">
<style>
/* «Звонки МТС» — 19.11.2026, Т. В.: «письма с МТС с отчётами по связи — учесть на портале по сим-картам; по переговорам и корпоративным
   номерам — особый контроль; анализ звонков соединить с базой клиентов; что не привязано — вопрос менеджеру».
   Звонки — st/calls.bin (робот mts.py: детализации МТС с 1c@); справочник номеров — сборка (build/calls_mts/phones.json: 1С ЖПС + СИМ-карты). */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 2px -4px;padding:4px;border:0;background:none;color:var(--ios-blue);font:400 17px var(--f-body);cursor:pointer;text-decoration:none}
.back::before{content:"";width:10px;height:10px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;transform:rotate(45deg);margin:0 2px 0 4px;border-radius:1px}
.lead{color:var(--ios-2);margin:4px 0 0;font-size:15px;max-width:62ch}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kgrid .igroup{margin:0;padding:14px}
.kt{font-size:13px;color:var(--ios-2);font-weight:600}
.kv{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.ks{font-size:12.5px;color:var(--ios-2);margin-top:3px}
.st{display:inline-block;font:600 12.5px var(--f-body);padding:2px 8px;border-radius:9px;margin-top:8px}
.st.ok{background:rgba(52,199,89,.15);color:#1E7B34}.st.bad{background:rgba(255,59,48,.14);color:#C0271D}
.sec{font:600 13px var(--f-body);color:var(--ios-2);text-transform:uppercase;letter-spacing:.03em;margin:22px 4px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:11px 16px;border-top:.5px solid var(--ios-sep);font-size:14.5px}
.row:first-child{border-top:0}
.row b{font-weight:600}.row small{display:block;color:var(--ios-2);font-size:12.5px;margin-top:1px}
.row .n{font:600 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .n small{text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8e8e93;margin-right:6px;vertical-align:middle}
.dot.p{background:#ff9500}.dot.nt{background:#ff3b30}
.tabs{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);border:0;border-radius:16px;padding:6px 12px;background:var(--ios-fill,rgba(120,120,128,.12));color:var(--ios-label);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ios-blue);color:#fff}
.snap{font:inherit;font-size:13px;border:0;background:none;color:var(--ios-blue);cursor:pointer;padding:0}
.shot{grid-column:1/-1}.shot img{display:block;width:100%;border-radius:10px;margin-top:8px}
.foot{margin:12px 4px 0;color:var(--ios-2);font-size:13px;line-height:1.45}
.foot a{color:var(--ios-blue);text-decoration:none;font-weight:600}
@media (max-width:340px){.kgrid{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st.ok{color:#4CD964}:root:not([data-theme="light"]) .st.bad{color:#FF6B61}}
:root[data-theme="dark"] .st.ok{color:#4CD964}:root[data-theme="dark"] .st.bad{color:#FF6B61}

.warn{color:#C0271D}.ok2{color:#1E7B34}
</style>
<main class="ios" id="mts">
  <a class="back" href="razdel.html#people">Люди</a>
  <h1>Звонки МТС</h1>
  <p class="lead">Детализация корпоративных номеров: МТС присылает её каждое утро за прошлый день. Каждый номер собеседника сверяется с карточками клиентов 1С и списком СИМ-карт: «не в 1С» — контакт без привязки к учётной системе, вопрос менеджеру.</p>
  <div id="view"><p class="lead">Загружаю…</p></div>
</main>
<script src="assets/live.js"></script>
<script>
(function(){
  var V=document.getElementById('view'), P=__MTSPH__, Z=null, F='all', SEL='';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function n(x){return Number(x||0).toLocaleString('ru-RU')}
  function mm(s){s=+s||0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function fmt(p){p=String(p||'');return p.length===11?'+7 '+p.slice(1,4)+' '+p.slice(4,7)+'-'+p.slice(7,9)+'-'+p.slice(9):p}
  function who(p){var s=P.st[p],c=P.cl[p];if(s)return{k:'staff',t:s[0],s:'сотрудник · '+s[1]+(s[2]?' · MAX '+s[2]:'')};if(c)return{k:c[2]==='п'?'sup':'cl',t:c[0],s:(c[2]==='п'?'поставщик':'клиент')+(c[1]?' · менеджер '+c[1]:'')};return{k:'none',t:'не в 1С',s:'номера нет в карточках 1С и в списке СИМ-карт'}}
  function line(me){var s=P.st[me];return s?s[0]:fmt(me)}
  function draw(){
    if(!Z||!Z.calls){V.innerHTML='<p class="lead">Детализации ещё не разобраны роботом. Страница обновится сама.</p>';return}
    // 26.11.2026, Т. В. (скрин «1 889 009 мин»): в детализации МТС кроме звонков — сессии интернета (4G/3G/gprs, объём в «длительности») и SMS;
    //   звонками считаем только голос, итоги по номерам — из тех же звонков
    var VO=Z.calls.filter(function(c){return !/4G|3G|LTE|gprs|hsdpa|sms|интернет/i.test(c.svc||'')}), L={};
    VO.forEach(function(c){var x=L[c.me]||(L[c.me]={n:0,dur:0,u:{}});x.n++;x.dur+=c.dur||0;if(c.o)x.u[c.o]=1});
    Object.keys(L).forEach(function(me){L[me].uniq=Object.keys(L[me].u).length});
    var C=VO.filter(function(c){return !SEL||c.me===SEL}), h='';
    var tot=C.length, cl=0, none=0, nset={};
    C.forEach(function(c){var w=who(c.o);if(w.k==='cl')cl++;if(w.k==='none'){none++;nset[c.o]=1}});
    h+='<div class="kgrid"><div class="igroup"><div class="kt">Звонков за '+Z.days+' дн.</div><div class="kv">'+n(tot)+'</div><div class="ks">номеров с детализацией: '+Object.keys(L).length+'</div></div>'+
       '<div class="igroup"><div class="kt">С клиентами из 1С</div><div class="kv">'+(tot?Math.round(cl/tot*100):0)+'%</div><div class="ks">'+n(cl)+' звонков</div></div>'+
       '<div class="igroup"><div class="kt">Не привязаны к 1С</div><div class="kv warn">'+n(none)+'</div><div class="ks">'+Object.keys(nset).length+' разных номеров — вопрос менеджеру</div></div>'+
       '<div class="igroup"><div class="kt">Обновлено</div><div class="kv" style="font-size:20px">'+esc((Z.t||'').slice(8,10)+'.'+(Z.t||'').slice(5,7)+' '+(Z.t||'').slice(11,16))+'</div><div class="ks">робот хостинга</div></div></div>';
    h+='<div class="sec">Номера</div><div class="igroup">'+Object.keys(L).sort(function(a,b){return L[b].n-L[a].n}).map(function(me){var x=L[me];return '<div class="row" data-me="'+me+'" style="cursor:pointer'+(SEL===me?';background:rgba(0,122,255,.08)':'')+'"><div><b>'+esc(line(me))+'</b><small>'+fmt(me)+(P.st[me]&&P.st[me][2]?' · MAX '+P.st[me][2]:'')+(P.st[me]&&P.st[me][1]==='Уволенные'?' · <span class="warn">уволен — СИМ числится</span>':'')+' · разных собеседников '+x.uniq+'</small></div><div class="n">'+n(x.n)+'<small>'+mm(x.dur)+' мин</small></div></div>'}).join('')+'</div>';
    h+='<div class="tabs">'+[['all','Все'],['none','Не в 1С'],['cl','Сотрудник9'],['staff','Сотрудники']].map(function(t){return '<button data-f="'+t[0]+'" aria-pressed="'+(F===t[0])+'">'+t[1]+'</button>'}).join('')+(SEL?'<button data-me="">Все номера</button>':'')+'</div>';
    var rows=C.filter(function(c){return F==='all'||who(c.o).k===F}).slice(0,400);
    h+='<div class="igroup" style="margin-top:8px">'+(rows.length?rows.map(function(c){var w=who(c.o);return '<div class="row"><div><b class="'+(w.k==='none'?'warn':'')+'">'+esc(w.t)+'</b><small>'+fmt(c.o)+' · '+esc(w.s)+' · '+esc(line(c.me))+(c.dir==='in'?' ← входящий':' → исходящий')+'</small></div><div class="n">'+mm(c.dur)+'<small>'+c.d.slice(8,10)+'.'+c.d.slice(5,7)+' '+c.t.slice(0,5)+'</small></div></div>'}).join(''):'<div class="row"><div>Нет звонков по этому фильтру</div></div>')+'</div>';
    h+='<p class="foot">Источник номеров: '+esc(P.src)+'. Детализацию МТС присылает только по номерам, на которые она заказана (сейчас 11 лицевых счетов). Чтобы контроль был полным, нужна детализация по всем корпоративным номерам.</p>';
    V.innerHTML=h;
    V.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){F=b.getAttribute('data-f');draw()}});
    V.querySelectorAll('[data-me]').forEach(function(b){b.onclick=function(){SEL=b.getAttribute('data-me')===SEL?'':b.getAttribute('data-me');draw()}});
  }
  function load(){ if(window.T14Live&&T14Live.bin) T14Live.bin('calls.bin').then(function(d){if(d){Z=d;draw()}}).catch(function(){}); }
  draw(); load(); setInterval(load,300000);
})();
</script>
