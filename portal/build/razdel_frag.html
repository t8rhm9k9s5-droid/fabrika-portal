<title>Фабрика — раздел</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/site.css">
<style>
/* «Раздел» — 13.11.2026, Т. В.: «обнови портал по последним правкам его структуры» (проект 12.11: work/portal_struct/struct.json, макет
   «Портал Фабрика — новая структура»). Десять разделов по функциям компании; в разделе — подразделы со ссылками прямо на отчёты:
   Главная → раздел → отчёт = 2 клика (подробности — третий). Онлайн-продажи — первыми в «Продажах». Отчёты живут на прежних страницах,
   ссылки ведут к их подразделам (#s-… и #маршрут), поэтому ничего не ломается. Без хэша — карта всех разделов. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 2px -4px;padding:4px;border:0;background:none;color:var(--ios-blue);font:400 17px var(--f-body);cursor:pointer;text-decoration:none}
.back::before{content:"";width:10px;height:10px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;transform:rotate(45deg);margin:0 2px 0 4px;border-radius:1px}
.lead{color:var(--ios-2);margin:4px 0 0;font-size:15px;max-width:62ch}
.rz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.rz-card{background:var(--ios-group);border-radius:14px;padding:14px 16px 10px;box-shadow:0 0 0 .5px var(--ios-sep)}
.rz-card.pri{box-shadow:0 0 0 1.5px var(--ios-blue)}
.rz-card h2{font:600 17px/1.25 var(--f-display);margin:0 0 6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.rz-tag{font:600 11.5px var(--f-body);color:#93370d;background:#fef0e6;border-radius:999px;padding:3px 9px;white-space:nowrap}
.rz-card ul{list-style:none;margin:0;padding:0}
.rz-card li a,.rz-card li span{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-top:.5px solid var(--ios-sep);color:var(--ios-label);text-decoration:none;font-size:15px;min-height:44px}
.rz-card li:first-child a,.rz-card li:first-child span{border-top:0}
.rz-card li a::after{content:"›";color:var(--ios-3,#8e8e93);font-size:20px;line-height:1}
.rz-card li span{color:var(--ios-2)}
.rz-card li span small{font-size:12px}
.rz-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.rz-map a{display:block;background:var(--ios-group);border-radius:14px;padding:14px 16px;box-shadow:0 0 0 .5px var(--ios-sep);text-decoration:none;color:var(--ios-label)}
.rz-map a b{display:block;font:600 16px var(--f-display)}
.rz-map a small{display:block;color:var(--ios-2);font-size:13px;margin-top:4px}
.pfoot{color:var(--ios-2);font-size:12.5px;margin:14px 2px 0}
</style>

    var p = J('t14.me'); if (!p || p.st === 'pending') return false;

    var f = J(a === 'gl' ? 't14.gl' : 't14.sec'); return !!(f && f.id === p.id);
