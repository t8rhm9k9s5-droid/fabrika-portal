     Администраторы портала «Фабрика»: Сотрудник Сотрудник Отчество (владелец) и Сотрудник Сотрудник Отчество — с равными правами.
     Команда Сотрудник Отчество = команда Сотрудник Отчество, любым каналом: почта (в т. ч. user@example.org, user@example.org), боты MAX/Telegram (текст и голос), чат.
     Выполнять как команду владельца; автору — отчёт по каждому пункту (внесено / не внесено и почему / вопрос), владельцу — копия. Подробно: АДМИНИСТРАТОРЫ.md в корне исходников. -->
<title>Фабрика — счётчики и откачка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/site.css">
<style>
/* «Счётчики и откачка сточных вод» — 04.11.2026, решение Т. В. Сотрудник (опрос): «Внеси на портал раздел с показаниями счётчиков
   и откачки сточных вод и там положи эти данные». Данные — build/utils/utils.json (снимок); дальше — с Диска 1c@ от ботов. Стиль — как «Транспорт» и «ОМТС». */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 2px -4px;padding:4px;border:0;background:none;color:var(--ios-blue);font:400 17px var(--f-body);cursor:pointer;text-decoration:none}
.back::before{content:"";width:10px;height:10px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;transform:rotate(45deg);margin:0 2px 0 4px;border-radius:1px}
.lead{color:var(--ios-2);margin:4px 0 0;font-size:15px;max-width:62ch}
.hero{padding:16px 16px 14px}
.hero .hnum{font:700 36px/1.05 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .hnum small{font:600 18px var(--f-display);color:var(--ios-2);letter-spacing:0;margin-left:6px}
.hero .hsub{color:var(--ios-2);font-size:14px;margin-top:4px}
.hero .hst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--ios-sep)}
.hero .hst > div > span{display:block;font-size:12.5px;color:var(--ios-2)}
.hero .hst b{display:block;font:600 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.hero .hst b small{font:500 12.5px var(--f-body);color:var(--ios-2);margin-left:3px}
@media (max-width:420px){.hero .hst{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}}
.gnote{padding:14px 16px;color:var(--ios-2);font-size:14.5px;line-height:1.45;margin:0}
.gnote b{color:var(--ios-label)}
.gnote a{color:var(--ios-blue);text-decoration:none;font-weight:600}
.gtab{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gtab table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.gtab th,.gtab td{padding:9px 6px;text-align:right;border-top:.5px solid var(--ios-sep);vertical-align:top;white-space:nowrap}
.gtab th:first-child,.gtab td:first-child{text-align:left;padding-left:16px;white-space:normal;overflow-wrap:break-word;min-width:96px}
.gtab th:last-child,.gtab td:last-child{padding-right:16px}
.gtab td.l,.gtab th.l{text-align:left;white-space:normal}
.gtab th{font-weight:500;color:var(--ios-2);font-size:12px;border-top:0;vertical-align:bottom}
.gtab td small{display:block;color:var(--ios-2);font-size:11.5px;white-space:normal}
.gtab tfoot td{font-weight:600}
.gtab td.no{color:var(--ios-2)}
@media (max-width:380px){.gtab table{font-size:12.5px}.gtab th,.gtab td{padding:8px 4px}.gtab th:first-child,.gtab td:first-child{padding-left:12px}.gtab th:last-child,.gtab td:last-child{padding-right:12px}}
.prow{padding:12px 16px;border-top:.5px solid var(--ios-sep);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.prow:first-child{border-top:0}
.prow .pd{font:600 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .pv{font:600 15px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .pb{min-width:0}
.prow .pb b{font-weight:600}
.prow .pb small{display:block;color:var(--ios-2);font-size:13px;margin-top:2px}
.pchip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(255,149,0,.16);color:#9A5A00;margin-top:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pchip{color:#E8A33D}}
:root[data-theme="dark"] .pchip{color:#E8A33D}
.pfoot{margin:10px 2px 0;color:var(--ios-2);font-size:13px}
</style>
<main class="ios" id="utils">
  <a class="back" href="plan.html">Карта производства</a>
  <h1>Счётчики и откачка</h1>
  <p class="lead">Показания приборов учёта (электроэнергия, газ, вода) и откачка сточных вод: когда, сколько, кто.</p>
  <div id="view"><p class="lead">Загружаю…</p></div>
</main>
<script id="ut-data" type="application/json">__UTILS__</script>
<script>
(function () {
  var D = {}; try { D = JSON.parse(document.getElementById('ut-data').textContent); } catch (e) {}
  var V = document.getElementById('view');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n(x) { return String(x).replace('.', ','); }
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  function dt(s) { var p = String(s).split('-'); return +p[2] + ' ' + MON[+p[1] - 1]; }
  function day(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function pl(k, a, b, c) { k = Math.abs(k) % 100; var r = k % 10; return k > 10 && k < 20 ? c : r === 1 ? a : r > 1 && r < 5 ? b : c; }
  var P = (D.pumps || []).slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; });
  var now = new Date(); now.setHours(0, 0, 0, 0);
  function sum(f) { var L = P.filter(f); return { n: L.length, v: L.reduce(function (s, x) { return s + (+x.v || 0); }, 0) }; }
  var yd = new Date(now - 864e5), wk = new Date(now - 7 * 864e5);
  var cm = now.getMonth(), cy = now.getFullYear(), pm = (cm + 11) % 12, py = cm ? cy : cy - 1;
  var S = {
    yday: sum(function (x) { return +day(x.d) === +yd; }),
    week: sum(function (x) { return day(x.d) >= wk && day(x.d) < now; }),
    month: sum(function (x) { var d = day(x.d); return d.getMonth() === cm && d.getFullYear() === cy; }),
    prev: sum(function (x) { var d = day(x.d); return d.getMonth() === pm && d.getFullYear() === py; })
  };
  function cell(t, s) { return '<div><span>' + esc(t) + '</span><b>' + (s.n ? n(s.v) + '<small>м³</small>' : '—') + '</b></div>'; }
  var last = P[0];
  var h = '<div class="igroup hero"><div class="hnum">' + (last ? n(last.v) + '<small>м³</small>' : '—') + '</div>' +
    '<div class="hsub">' + (last ? 'Последняя откачка — ' + esc(dt(last.d)) + ' · ' : 'Откачек нет · ') + esc(S.prev.n + ' ' + pl(S.prev.n, 'откачка', 'откачки', 'откачек') + ' за ' + MONN[pm] + ', ' + n(S.prev.v) + ' м³') + '</div>' +
    '<div class="hst">' + cell('Вчера', S.yday) + cell('Неделя', S.week) + cell(MONN[cm][0].toUpperCase() + MONN[cm].slice(1), S.month) + cell(MONN[pm][0].toUpperCase() + MONN[pm].slice(1), S.prev) + '</div></div>';
  h += '<p class="ihdr">Откачка сточных вод · ' + P.length + '</p><div class="igroup">';
  h += P.map(function (x) {
    return '<div class="prow"><span class="pd">' + esc(dt(x.d)) + '</span><span class="pb"><b>' + esc(x.kind || 'Откачка') + '</b>' + (x.t ? ' · ' + esc(x.t) : '') +
      '<small>Исполнитель: ' + esc(x.who) + (x.who_note ? ' (' + esc(x.who_note) + ')' : '') + '</small>' +
      '<small>Заказчик: ' + esc(x.cust) + (x.cust_sign ? ', подписал ' + esc(x.cust_sign) : '') + (x.mark ? ' · отметка ' + esc(x.mark) : '') + '</small>' +
      (x.place ? '<small>Место: ' + esc(x.place) + '</small>' : '<span class="pchip">место уточняется</span>') +
      '</span><span class="pv">' + n(x.v) + ' м³</span></div>';
  }).join('') + '</div>';
  h += '<p class="pfoot">' + esc(D.place_note || '') + (D.acts_pdf ? ' <a href="' + esc(encodeURI(D.acts_pdf)) + '" target="_blank" rel="noopener" data-pdf="1" data-t="Акты откачки ЖБО" data-m="07.10 и 23.10.2026 · 2 стр." data-back="Счётчики и откачка" style="color:var(--ios-blue);text-decoration:none;font-weight:600">Акты (фото), PDF</a>' : '') + '</p>';
  if ((D.septics || []).length) {
    h += '<p class="ihdr">Выгребные ямы и септики</p><div class="igroup gtab"><table><thead><tr><th>Где</th><th>Объём</th><th>Откачка</th><th>Следующая</th></tr></thead><tbody>' +
      D.septics.map(function (s) {
        var nx = last && s.every ? new Date(+day(last.d) + s.every * 864e5) : null;
        return '<tr><td>' + esc(s.n) + '</td><td>≈ ' + n(s.vol) + ' м³</td><td>раз в ' + s.every + ' дн.</td><td>' + (nx ? '≈ ' + nx.getDate() + ' ' + MON[nx.getMonth()] + '<small>если откачка отсюда</small>' : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  h += '<p class="ihdr">Счётчики · ' + (D.meters || []).length + '</p><div class="igroup gtab"><table><thead><tr><th>Прибор</th><th class="l">Последнее</th><th class="l">За ' + MONN[pm] + '</th></tr></thead><tbody>' +
    (D.meters || []).map(function (m) {
      return '<tr><td>' + esc(m.n) + '<small>' + esc(m.u) + '</small></td>' + (m.last ? '<td class="l">' + esc(m.last) + '</td>' : '<td class="l no">нет показаний</td>') + (m.month ? '<td class="l">' + esc(m.month) + '</td>' : '<td class="l no">—</td>') + '</tr>';
    }).join('') + '</tbody></table></div>';
  h += '<div class="igroup"><p class="gnote">' + esc(D.meters_note || '') + '</p></div>';
  h += '<p class="pfoot">' + esc(D.how || '') + '</p>';
  if (D.asof) h += '<p class="pfoot">' + esc(D.note || '') + '</p>';
  V.innerHTML = h;
})();
</script>
