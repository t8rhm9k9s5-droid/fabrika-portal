<script>
(function(){
  // 20.11.2026, Т. В.: «в рамках TechFabrikant.ru отдельный раздел «Сайт», поднимаешь там сайт из этого FTP; ходишь только внутри FTP»
  var V=document.getElementById('view'), TB=document.getElementById('tabs'), Z=null, STO=null, TAB='cat', CUR='/', Q='', OPEN=null;
  var TABS=[['cat','Каталог'],['off','Обивки'],['col','Цвета'],['prj','Проекты'],['sto','Магазины'],['cli','Сотрудник10'],['iss','Замечания'],['fs','Файлы']];
  var CITY={moscow:'Москва','saint-petersburg':'Санкт-Петербург',ryazan:'Рязань',samara:'Самара',ekaterinburg:'Екатеринбург',krasnodar:'Краснодар',simferopol:'Симферополь','nizhny-novgorod':'Сотрудник15 Имя3',almaty:'Алматы'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function sz(b){b=+b||0;return b>1048576?(b/1048576).toFixed(1)+' МБ':b>1024?Math.round(b/1024)+' КБ':b+' Б'}
  function base(p){return p.split('/').pop()}
  function isImg(p){return /\.(jpe?g|png|webp|gif|svg)$/i.test(p)}
  function moj(s){return /Р[ЉЊЋЏЃљњћџѓ]|Рћ|Рѕ|Ð|Ñ/.test(s)}
  function nice(fn){var n=fn.replace(/\.[a-z0-9]+$/i,'').replace(/^(main|view|line|photo|cover)_/i,'').replace(/(_2x)?(_\d+)+$/,'').replace(/[_-]+/g,' ').trim();return n?n.charAt(0).toUpperCase()+n.slice(1):fn}
  function M(){ // разбор индекса FTP в сущности сайта
    if(M.c&&M.c.z===Z) return M.c; var P={},O={},C=[],J={},L=[],R=[];
    (Z.items||[]).forEach(function(i){var a=i.p.split('/');if(i.d) return;
      if(a[1]==='catalog'&&a[2]==='products'&&a[3]){var o=P[a[3]]||(P[a[3]]={code:a[3],ph:[],pdf:[],lead:null,big:0});if(isImg(i.p)){o.ph.push(i);if(i.lead)o.lead=i;if(i.s>3145728)o.big++}else if(/\.pdf$/i.test(i.p))o.pdf.push(i)}
      else if(a[1]==='catalog'&&a[2]==='offers'&&a[3]){var f=O[a[3]]||(O[a[3]]={code:a[3],ph:[],lead:null});if(isImg(i.p)){f.ph.push(i);if(i.lead)f.lead=i}}
      else if(a[1]==='catalog'&&a[2]==='collections'){if(isImg(i.p))C.push(i)}
      else if(a[1]==='projects'&&a[2]){var j=J[a[2]]||(J[a[2]]={code:a[2],ph:[],lead:null});if(isImg(i.p)){j.ph.push(i);if(i.lead)j.lead=i}}
      else if(a[1]==='client-logos'){if(isImg(i.p))L.push(i)}
      else if(a[1]==='reports')R.push(i)});
    function fin(o){Object.keys(o).forEach(function(k){var x=o[k];if(!x.lead)x.lead=x.ph.slice().sort(function(a,b){return a.p<b.p?-1:1})[0]||null;x.name=x.lead?nice(base(x.lead.p)):x.code});return Object.keys(o).map(function(k){return o[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'ru')})}
    return (M.c={z:Z,P:fin(P),O:fin(O),C:C,J:fin(J),L:L,R:R});
  }
  function img(i,cls){if(!i) return '<div class="ph0 '+(cls||'')+'">нет фото</div>';return i.id?'<img data-id="'+i.id+'" data-n="'+esc(i.p)+'" alt="'+esc(base(i.p))+'">':'<div class="ph0">фото загружается</div>'}
  function tabs(){TB.innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" aria-pressed="'+(TAB===t[0])+'">'+t[1]+'</button>'}).join('');TB.querySelectorAll('button').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;OPEN=null;Q='';draw();try{history.replaceState(null,'','#'+TAB)}catch(e){}}})}
  function hook(){V.querySelectorAll('img[data-id]').forEach(function(im){T14Live.file(im.dataset.id).then(function(b){if(b)im.src=URL.createObjectURL(new Blob([b],{type:/\.svg$/i.test(im.dataset.n)?'image/svg+xml':/\.png$/i.test(im.dataset.n)?'image/png':'image/jpeg'}))})});
    V.querySelectorAll('[data-open]').forEach(function(a){a.onclick=function(){OPEN=a.dataset.open;draw();window.scrollTo(0,0)}});
    V.querySelectorAll('[data-pdf]').forEach(function(a){a.onclick=function(){T14Live.download(a.dataset.pdf,base(a.dataset.n),'Инструкция')}});
    var s=V.querySelector('.srch');if(s){s.oninput=function(){Q=s.value;var p=s.selectionStart;draw();var t=V.querySelector('.srch');if(t){t.focus();try{t.setSelectionRange(p,p)}catch(e){}}}}
    V.querySelectorAll('[data-p]').forEach(function(a){a.onclick=function(){CUR=a.getAttribute('data-p');draw();window.scrollTo(0,0)}});
    V.querySelectorAll('.back2').forEach(function(a){a.onclick=function(){OPEN=null;draw()}})}
  function cards(list,kind,unit){var q=Q.toLowerCase(),L=list.filter(function(x){return !q||(x.name+' '+x.code).toLowerCase().indexOf(q)>=0});
    return '<input class="srch" placeholder="Поиск по названию или коду" value="'+esc(Q)+'"><p class="foot">'+L.length+' '+unit+'</p><div class="grid">'+L.slice(0,400).map(function(x){return '<div class="tile ptile" data-open="'+kind+':'+esc(x.code)+'">'+img(x.lead)+'<div><div class="nm">'+esc(x.name)+'</div><div class="cd">'+esc(x.code)+' · фото '+x.ph.length+(x.pdf&&x.pdf.length?' · инструкция':'')+'</div></div></div>'}).join('')+'</div>'}
  function detail(x,kind){var h='<p style="margin:14px 0 0"><button class="snap back2">‹ Назад к списку</button></p><h2 style="margin:8px 0 2px">'+esc(x.name)+'</h2><p class="foot" style="margin-top:0">Код '+esc(x.code)+' · фото '+x.ph.length+(x.big?' · крупных (больше 3 МБ) '+x.big:'')+'</p>';
    if(x.pdf&&x.pdf.length) h+='<div class="igroup" style="margin-top:10px">'+x.pdf.map(function(f){return '<div class="row"><div><b>'+esc(base(f.p))+'</b><small>'+sz(f.s)+'</small></div><div class="n">'+(f.id?'<button class="snap" data-pdf="'+f.id+'" data-n="'+esc(f.p)+'">Открыть</button>':'<small>загружается</small>')+'</div></div>'}).join('')+'</div>';
    h+='<div class="gal">'+x.ph.map(function(i){return '<div>'+img(i)+'<div class="foot" style="margin:4px 2px 0;font-size:11.5px">'+esc(base(i.p))+' · '+sz(i.s)+'</div></div>'}).join('')+'</div>';return h}
  function issues(m){var I=[],it=Z.items||[];
    var mj=it.filter(function(i){return moj(i.p)});if(mj.length)I.push(['Имена в неверной кодировке: '+mj.length,'Папки и файлы, у которых кириллица записана как «Рљ…», «Ð…» — так ломаются ссылки на сайте. Примеры: '+mj.slice(0,3).map(function(i){return i.p}).join(', ')]);
    var np=m.P.filter(function(x){return !x.ph.length});if(np.length)I.push(['Товары без фото: '+np.length,np.slice(0,12).map(function(x){return x.code}).join(', ')]);
    var nm=m.P.filter(function(x){return x.ph.length&&!x.ph.some(function(i){return /\/(main|cover)[^/]*$/i.test(i.p)})});if(nm.length)I.push(['Товары без главного фото (main_…): '+nm.length,'На сайте обложкой станет случайное фото. Примеры: '+nm.slice(0,8).map(function(x){return x.code+' ('+x.name+')'}).join(', ')]);
    var big=it.filter(function(i){return !i.d&&isImg(i.p)&&i.s>3145728});if(big.length)I.push(['Слишком тяжёлые картинки (больше 3 МБ): '+big.length,'Страницы сайта грузятся долго, особенно с телефона. Самые крупные: '+big.sort(function(a,b){return b.s-a.s}).slice(0,5).map(function(i){return base(i.p)+' — '+sz(i.s)}).join(', ')]);
    var nc=m.P.filter(function(x){return !/^\d{11}$/.test(x.code)});if(nc.length)I.push(['Папки товаров не по коду 1С: '+nc.length,nc.slice(0,8).map(function(x){return x.code}).join(', ')+' — такие карточки не свяжутся с 1С']);
    var dn={};m.P.forEach(function(x){x.ph.forEach(function(i){var k=base(i.p)+'|'+i.s;(dn[k]=dn[k]||[]).push(x.code)})});var dup=Object.keys(dn).filter(function(k){return dn[k].length>1&&!/^instruction/.test(k)});if(dup.length)I.push(['Одинаковые фото у разных товаров: '+dup.length,dup.slice(0,5).map(function(k){return k.split('|')[0]+' — '+dn[k].slice(0,3).join(', ')}).join('; ')]);
    var ins=m.P.filter(function(x){return x.pdf.length}).length;I.push(['Инструкции (PDF) есть у '+ins+' из '+m.P.length+' товаров',ins<m.P.length?'У остальных на сайте нет инструкции по сборке.':'',ins===m.P.length]);
    var so=STO&&STO.stores?Object.keys(STO.stores):[];so.forEach(function(k){var s=STO.stores[k];if(s.err)I.push(['Таблица магазинов не читается: '+base(k),s.err]);else if(!s.n)I.push(['Пустая таблица магазинов: '+base(k),'']);});
    if(!m.R.length)I.push(['Папка reports пуста','Отчёты 1С на FTP ещё не поступают — выгрузку попросили у В. Сотрудник11 20.11.']);
    if(!m.L.length||m.L.length<5)I.push(['Логотипов клиентов мало: '+m.L.length,'Для блока «Наши клиенты» обычно нужно 10–20.']);
    return '<div class="igroup iss" style="margin-top:14px">'+I.map(function(x){return '<div class="row'+(x[2]?' ok2':'')+'"><div><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></div></div>'}).join('')+'</div><p class="foot">Проверка — по описи FTP от '+esc((Z.t||'').replace('T',' '))+'. Замечания для владельцев сайта (отдел продаж) и для программистов 1С.</p>'}
  function stores(){if(!STO||!STO.stores) return '<p class="lead">Таблицы магазинов загружаются — робот разберёт их в ближайший обход FTP.</p>';
    var K=Object.keys(STO.stores).sort(function(a,b){return (CITY[base(a).replace('.xlsx','')]||a).localeCompare(CITY[base(b).replace('.xlsx','')]||b,'ru')});
    return K.map(function(k){var s=STO.stores[k],c=CITY[base(k).replace(/\.xlsx$/i,'')]||base(k);
      return '<details class="rep"'+(K.length<3?' open':'')+'><summary><b>'+esc(c)+'</b> · '+(s.err?'не читается':(s.n||0)+' строк')+'</summary>'+(s.err?'<p class="foot">'+esc(s.err)+'</p>':'<div class="tbl"><table><thead><tr>'+(s.h||[]).map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+(s.rows||[]).map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>')+'</details>'}).join('')}
  function files(){

    function cnt(p){var pre=p+'/',n=0,b=0;(Z.items||[]).forEach(function(i){if(!i.d&&i.p.indexOf(pre)===0){n++;b+=i.s||0}});return [n,b]}
    var parts=CUR.split('/').filter(Boolean),h='<div class="crumbs"><a data-p="/">FTP</a>'+parts.map(function(x,i){return ' / <a data-p="/'+parts.slice(0,i+1).join('/')+'">'+esc(x)+'</a>'}).join('')+'</div>';
    var K=kids(CUR),D=K.filter(function(i){return i.d}),F=K.filter(function(i){return !i.d});
    if(D.length) h+='<div class="igroup" style="margin-top:10px">'+D.map(function(d){var c=cnt(d.p);return '<div class="row" data-p="'+esc(d.p)+'" style="cursor:pointer"><div><b>📁 '+esc(base(d.p))+'</b></div><div class="n">'+c[0]+'<small>'+sz(c[1])+'</small></div></div>'}).join('')+'</div>';
    if(F.length) h+='<div class="igroup" style="margin-top:10px">'+F.slice(0,500).map(function(f){return '<div class="row"><div>'+esc(base(f.p))+'<small>'+(f.m?f.m.slice(6,8)+'.'+f.m.slice(4,6)+'.'+f.m.slice(0,4):'')+'</small></div><div class="n">'+sz(f.s)+'</div></div>'}).join('')+'</div>';
    if(!K.length) h+='<p class="lead">Папка пуста.</p>';return h}
  function draw(){tabs();
    if(!Z){V.innerHTML='<div class="igroup" style="margin-top:14px"><div class="row"><div><b>Опись FTP ещё не получена</b><small>Робот хостинга обходит FTP раз в час.</small></div></div></div>';return}
    var m=M(),h='';
