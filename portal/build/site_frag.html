      '<h2 class="sec">Модели <small>'+m.P.length+'</small><a data-go="cat">Весь каталог ›</a></h2><div class="cards">'+top.map(function(x){return card(x,'p')}).join('')+'</div>'+
      (m.J.length?'<h2 class="sec">Проекты <small>'+m.J.length+'</small><a data-go="prj">Все проекты ›</a></h2><div class="plist">'+m.J.slice(0,3).map(function(x){return card(x,'j')}).join('')+'</div>':'')+
      (m.O.length?'<h2 class="sec">Обивки <small>'+m.O.length+'</small><a data-go="fab">Все обивки и цвета ›</a></h2><div class="sw">'+m.O.filter(function(o){return o.lead}).slice(0,12).map(function(x){return '<a class="card" data-go="fab"><div class="im">'+im(x.lead,x.name)+'</div><div class="tx"><div class="cd">'+esc(x.name)+'</div></div></a>'}).join('')+'</div>':'')+
      (m.L.length?'<h2 class="sec">Нам доверяют</h2><div class="logos">'+m.L.map(function(i){return '<div class="im">'+im(i,'')+'</div>'}).join('')+'</div>':'')}
  function cat(m){var q=Q.toLowerCase().trim(),L=m.P.filter(function(x){return (!q||(x.name+' '+x.code1c).toLowerCase().indexOf(q)>=0)&&(!LET||x.name.charAt(0).toUpperCase()===LET)});
    var letters=[];m.P.forEach(function(x){var c=x.name.charAt(0).toUpperCase();if(letters.indexOf(c)<0&&/[A-ZА-ЯЁ]/.test(c))letters.push(c)});letters.sort(function(a,b){return a.localeCompare(b,'ru')});
    return '<h2 class="sec" style="margin-top:0">Каталог <small>'+L.length+' из '+m.P.length+' моделей</small></h2><div class="toolbar"><input id="q" type="search" placeholder="Модель или код 1С" value="'+esc(Q)+'" aria-label="Поиск по каталогу"></div>'+
      '<div class="chips" style="margin-bottom:16px"><button class="chip" data-let="" aria-pressed="'+(!LET)+'">Все</button>'+letters.map(function(c){return '<button class="chip" data-let="'+c+'" aria-pressed="'+(LET===c)+'">'+c+'</button>'}).join('')+'</div>'+
      (L.length?'<div class="cards">'+L.slice(0,LIMIT).map(function(x){return card(x,'p')}).join('')+'</div>'+(L.length>LIMIT?'<div class="more"><button class="btn alt" id="more">Показать ещё '+Math.min(60,L.length-LIMIT)+'</button></div>':''):'<div class="empty">Ничего не нашлось. Попробуйте другое название или код.</div>')}
  function prod(m,id){var x=m.P.filter(function(p){return p.code===id})[0];if(!x) return '<div class="empty">Модель не найдена. <a data-go="cat">В каталог</a></div>';if(IMGI>=x.ph.length)IMGI=0;var cur=x.ph[IMGI];
    var rel=m.P.filter(function(p){return p!==x&&p.name.split(' ')[0]===x.name.split(' ')[0]}).slice(0,4);
    return '<p class="meta" style="margin:0 0 12px"><a data-go="cat" style="color:var(--w-acc);cursor:pointer">Каталог</a> › '+esc(x.name)+'</p><div class="pp"><div><div class="gmain">'+im(cur,x.name)+'</div>'+(x.ph.length>1?'<div class="thumbs">'+x.ph.map(function(i,k){return '<button data-img="'+k+'" aria-pressed="'+(k===IMGI)+'" aria-label="Фото '+(k+1)+'">'+im(i,'')+'</button>'}).join('')+'</div>':'')+'</div>'+
      '<div class="pinfo"><h1>'+esc(x.name)+'</h1><div class="meta">Производство «Фабрикант»</div><dl class="kv"><dt>Код 1С</dt><dd>'+esc(x.code1c)+'</dd><dt>Фото</dt><dd>'+x.ph.length+'</dd><dt>Инструкция</dt><dd>'+(x.pdf.length?'есть':'нет')+'</dd></dl>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+x.pdf.map(function(f){return f.id?'<button class="btn" data-pdf="'+f.id+'" data-n="'+esc(f.p)+'">Инструкция по сборке</button>':'<span class="meta">инструкция загружается</span>'}).join('')+'<a class="btn alt" data-go="where">Где купить</a><a class="btn alt" data-go="fab">Обивки и цвета</a></div></div></div>'+
      (rel.length?'<h2 class="sec">Из той же серии</h2><div class="cards">'+rel.map(function(r){return card(r,'p')}).join('')+'</div>':'')}
  function fab(m){var q=Q.toLowerCase().trim(),O=m.O.filter(function(o){return !q||o.name.toLowerCase().indexOf(q)>=0||o.code.indexOf(q)>=0});
    return '<h2 class="sec" style="margin-top:0">Обивки <small>'+m.O.length+'</small></h2><div class="toolbar"><input id="q" type="search" placeholder="Ткань, экокожа, цвет" value="'+esc(Q)+'" aria-label="Поиск обивки"></div><div class="sw">'+O.map(function(x){return '<div class="card"><div class="im">'+im(x.lead,x.name)+'</div><div class="tx"><div class="nm" style="font-size:13px">'+esc(x.name)+'</div><div class="cd">'+esc(x.code)+'</div></div></div>'}).join('')+'</div>'+
      '<h2 class="sec">Цвета <small>'+m.C.length+'</small></h2><div class="sw">'+m.C.map(function(i){return '<div class="card"><div class="im">'+im(i,'')+'</div><div class="tx"><div class="cd">'+esc(base(i.p).replace(/\.\w+$/,''))+'</div></div></div>'}).join('')+'</div>'}
  function prj(m){return '<h2 class="sec" style="margin-top:0">Проекты <small>'+m.J.length+'</small></h2><div class="plist">'+m.J.map(function(x){return card(x,'j')}).join('')+'</div>'}
  function prj1(m,id){var x=m.J.filter(function(p){return p.code===id})[0];if(!x) return '<div class="empty">Проект не найден.</div>';if(IMGI>=x.ph.length)IMGI=0;
    return '<p class="meta" style="margin:0 0 12px"><a data-go="prj" style="color:var(--w-acc);cursor:pointer">Проекты</a> › '+esc(x.name)+'</p><h1 style="font:800 30px/1.1 var(--f-display);margin:0 0 14px">'+esc(x.name)+'</h1><div class="gmain" style="aspect-ratio:16/9">'+im(x.ph[IMGI],x.name)+'</div>'+(x.ph.length>1?'<div class="thumbs">'+x.ph.map(function(i,k){return '<button data-img="'+k+'" aria-pressed="'+(k===IMGI)+'" aria-label="Фото '+(k+1)+'">'+im(i,'')+'</button>'}).join('')+'</div>':'')}
  function where(){if(!STO||!STO.stores) return '<h2 class="sec" style="margin-top:0">Где купить</h2><div class="empty">Адреса магазинов загружаются с FTP — робот разбирает таблицы городов в ближайший обход.</div>';
    var K=Object.keys(STO.stores).sort(function(a,b){return (CITY[base(a).replace(/\.xlsx$/i,'')]||a).localeCompare(CITY[base(b).replace(/\.xlsx$/i,'')]||b,'ru')});if(!CITYSEL||!STO.stores[CITYSEL])CITYSEL=K.filter(function(k){return /moscow/.test(k)})[0]||K[0];
    var s=STO.stores[CITYSEL],H=s.h||[];
    var body=s.err?'<div class="empty">Таблица этого города не читается: '+esc(s.err)+'</div>':(s.rows||[]).length?'<div class="stores">'+(s.rows||[]).map(function(r){var t=r[0]||'',rest=r.slice(1).map(function(v,k){return v?'<div>'+(H[k+1]?'<span style="opacity:.75">'+esc(H[k+1])+':</span> ':'')+esc(v)+'</div>':''}).join('');return '<div class="store"><b>'+esc(t)+'</b>'+rest+'</div>'}).join('')+'</div>':'<div class="empty">В таблице города пока нет магазинов.</div>';
    return '<h2 class="sec" style="margin-top:0">Где купить <small>'+K.length+' городов</small></h2><div class="city">'+K.map(function(k){var c=CITY[base(k).replace(/\.xlsx$/i,'')]||base(k);var n=(STO.stores[k].n||0);return '<button class="chip" data-city="'+esc(k)+'" aria-pressed="'+(k===CITYSEL)+'">'+esc(c)+(n?' · '+n:'')+'</button>'}).join('')+'</div>'+body}
  function cli(m){return '<h2 class="sec" style="margin-top:0">Нам доверяют <small>'+m.L.length+'</small></h2>'+(m.L.length?'<div class="logos">'+m.L.map(function(i){return '<div class="im">'+im(i,'')+'</div>'}).join('')+'</div>':'<div class="empty">Логотипов клиентов на FTP пока нет.</div>')}
  function check(m){var it=Z.items||[],I=[];function add(t,d,lvl){I.push([t,d,lvl])}
    var mj=m.P.filter(function(x){return moj(x.code)});if(mj.length)add('Битая кодировка у '+mj.length+' папок товаров','Например «'+mj[0].code+'» вместо «'+mj[0].code1c+'». Карточки не свяжутся с 1С, ссылки на сайте ломаются.','r');
    var np=m.P.filter(function(x){return !x.ph.length});if(np.length)add('Товары без фото: '+np.length,np.slice(0,10).map(function(x){return x.code1c}).join(', '),'r');
    var nm=m.P.filter(function(x){return x.ph.length&&!x.ph.some(function(i){return /\/(main|cover)[^/]*$/i.test(i.p)})});if(nm.length)add('Нет главного фото (main_…): '+nm.length,'Обложкой стало первое попавшееся фото. '+nm.slice(0,6).map(function(x){return x.code1c}).join(', '),'o');
    var big=it.filter(function(i){return !i.d&&isImg(i.p)&&i.s>3145728});if(big.length)add('Картинки тяжелее 3 МБ: '+big.length,'На портал не загружаются, на сайте грузятся долго. Самая крупная — '+base(big.sort(function(a,b){return b.s-a.s})[0].p)+' ('+sz(big[0].s)+').','o');
    var noname=m.P.filter(function(x){return /^Модель /.test(x.name)});if(noname.length)add('Нет понятного названия у '+noname.length+' моделей','Имена фото — хеши или цифры. Нужен список «код 1С → наименование».','o');
    var pdf=m.P.filter(function(x){return x.pdf.length}).length;add('Инструкции по сборке: '+pdf+' из '+m.P.length,'',pdf<m.P.length?'o':'g');
    if(STO&&STO.stores)Object.keys(STO.stores).forEach(function(k){var s=STO.stores[k];if(s.err)add('Не читается таблица '+base(k),s.err,'r');else if(!s.n)add('Пустая таблица '+base(k),'','o')});
    if(!m.R.length)add('Нет отчётов 1С в папке reports','Выгрузку попросили у В. Сотрудник11 20.11.','o');
    var pub=it.filter(function(i){return i.id}).length,tot=it.filter(function(i){return !i.d&&isImg(i.p)}).length;add('Загружено на портал: '+pub+' из '+tot+' картинок',pub<tot?'Робот догружает каждые 10 минут, пока очередь не кончится.':'Все картинки загружены.',pub<tot?'o':'g');
    var col={r:'#C0271D',o:'#B25E00',g:'#1E7B34'};
    return '<h2 class="sec" style="margin-top:0">Проверка сайта <small>по описи FTP '+esc((Z.t||'').replace('T',' '))+'</small></h2><div style="display:grid;gap:10px">'+I.map(function(x){return '<div class="store"><b style="color:'+col[x[2]]+'">'+esc(x[0])+'</b><div>'+esc(x[1])+'</div></div>'}).join('')+'</div><p class="meta" style="margin-top:14px">Полный список — в реестре ошибок сайта (таблица у Т. В.). Технический вид папок FTP — <a href="ftp.html" style="color:var(--w-acc)">файлы FTP</a>.</p>'}
  function draw(){var r=route();nav(r.pg);
    if(!Z){V.innerHTML='<div class="empty">Загружаю сайт с FTP…</div>';return}
    var m=M(),h='';
    if(r.pg==='cat')h=cat(m);else if(r.pg==='p')h=prod(m,r.id);else if(r.pg==='fab')h=fab(m);else if(r.pg==='prj')h=prj(m);else if(r.pg==='j')h=prj1(m,r.id);else if(r.pg==='where')h=where();else if(r.pg==='cli')h=cli(m);else if(r.pg==='check')h=check(m);else h=home(m);
    V.innerHTML=h;hook();loadImgs();
    var f=document.getElementById('fdate');if(f)f.textContent='Сайт fabrikant.su · данные с FTP на '+(Z.t||'').replace('T',' ')}
  function hook(){var q=document.getElementById('q');if(q){q.oninput=function(){Q=q.value;LIMIT=60;var p=q.selectionStart;draw();var t=document.getElementById('q');if(t){t.focus();try{t.setSelectionRange(p,p)}catch(e){}}}}
    V.querySelectorAll('[data-let]').forEach(function(b){b.onclick=function(){LET=b.dataset.let;LIMIT=60;draw()}});
    V.querySelectorAll('[data-img]').forEach(function(b){b.onclick=function(){IMGI=+b.dataset.img;draw()}});
    V.querySelectorAll('[data-city]').forEach(function(b){b.onclick=function(){CITYSEL=b.dataset.city;draw()}});
    V.querySelectorAll('[data-pdf]').forEach(function(b){b.onclick=function(){T14Live.download(b.dataset.pdf,base(b.dataset.n),'Инструкция по сборке')}});
    var mo=document.getElementById('more');if(mo)mo.onclick=function(){LIMIT+=60;draw()}}
  document.getElementById('site').addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(a){e.preventDefault();IMGI=0;if(a.dataset.go!=='cat'&&a.dataset.go!=='fab')Q='';go(a.dataset.go==='home'?'':a.dataset.go)}});
  document.getElementById('site').addEventListener('keydown',function(e){if(e.key==='Enter'){var a=e.target.closest&&e.target.closest('.card[data-go]');if(a){e.preventDefault();a.click()}}});
  window.addEventListener('hashchange',function(){IMGI=0;draw()});
  draw();
  if(window.T14Live&&T14Live.bin){T14Live.bin('ftp_idx.bin').then(function(d){if(d){Z=d;M.c=null;draw()}}).catch(function(){});T14Live.bin('ftp_stores.bin').then(function(d){if(d){STO=d;draw()}}).catch(function(){})}
})();
</script>
