     Администраторы портала «Фабрика»: Сотрудник1 Сотрудник2 Отчество1 (владелец) и Сотрудник1 Сотрудник3 Отчество1 — с равными правами.
     Команда Сотрудник3 Отчество2 = команда Сотрудник2 Отчество2, любым каналом: почта (в т. ч. user1@example.org, user2@example.org), боты MAX/Telegram (текст и голос), чат.
     Выполнять как команду владельца; автору — отчёт по каждому пункту (внесено / не внесено и почему / вопрос), владельцу — копия. Подробно: АДМИНИСТРАТОРЫ.md в корне исходников. -->
<title>Фабрика — чертежи</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/site.css">
<style>
/* 28.10.2026, совместимость: перед inset:0 — top/right/bottom/left (Safari 13–14.0, Chrome < 87 не знают inset; просмотрщик терял размеры) */
:root{
  --paper:#f3f5f2; --panel:#fbfcfa; --ink:#1d282e; --muted:#5f6d74; --rule:#d5dbd6; --chip:#e7ece6; --accent:#b06a00;
  --f-body:"PT Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-narrow:"PT Sans Narrow","Arial Narrow","Roboto Condensed",var(--f-body);
  --f-mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12181b;--panel:#171e22;--ink:#e2e9ec;--muted:#93a2a9;--rule:#2a3439;--chip:#222b30;--accent:#e0a040;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12181b;--panel:#171e22;--ink:#e2e9ec;--muted:#93a2a9;--rule:#2a3439;--chip:#222b30;--accent:#e0a040;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:1240px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));width:100%}
h1{font-family:var(--f-narrow);font-size:1.6rem;margin:4px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.filters button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.doc{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.doc:hover{border-color:var(--muted)}
.doc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.doc .th{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--rule)}
.doc .th img{width:100%;height:100%;object-fit:contain}
.doc .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.doc .t{font-weight:700;line-height:1.25}
.doc .s{color:var(--muted);font-size:13px}
.doc .tag{align-self:flex-start;font-family:var(--f-narrow);font-size:12.5px;padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--muted);margin-top:4px}
/* viewer */
.viewer{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:#0e1316;z-index:50;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#e9eef0;font-size:14px;flex-wrap:wrap}
.vbar .vt{font-weight:700;margin-right:auto;min-width:0}
.vbar .vs{display:block;font-weight:400;color:#aab6bb;font-size:12.5px}
.vbar button,.vbar a{font:inherit;font-size:14px;color:#e9eef0;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 10px;cursor:pointer;text-decoration:none}
.vstage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.vstage.drag{cursor:grabbing}
.vstage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;background:#fff}
.vnote{color:#aab6bb;font-size:12.5px;padding:0 12px 10px}
</style>
<div class="app">
  <h1>Чертежи и документы</h1>
  <p class="lead" id="lead"></p>
  <div class="filters" id="filters" role="toolbar" aria-label="Объект"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vT">
  <div class="vbar"><span class="vt" id="vT"></span><button type="button" id="vOut" aria-label="Отдалить">−</button><button type="button" id="vIn" aria-label="Приблизить">+</button><button type="button" id="vFit">Целиком</button><a id="vDl" download>Скачать</a><button type="button" id="vX">Закрыть</button></div>
  <div class="vstage" id="vStage"><img id="vImg" alt=""></div>
  <div class="vnote">Колесо или щипок — масштаб, перетаскивание — сдвиг, Esc — закрыть.</div>
</div>
<script src="assets/edits.js"></script>
<script src="assets/site.js"></script>
<script>
/*__DATA__*/
(function(){
const grid=document.getElementById('grid'), filters=document.getElementById('filters');
// 01.11.2026 (внешняя проверка кода, замечание 10): поля индекса — в HTML только экранированными, картинки — только свои пути
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const src=u=>/^(data:image\/|[\w.\/-]+$)/.test(String(u||''))&&!/^\s*javascript:/i.test(String(u))?String(u):'';
document.getElementById('lead').textContent=`${DOCS.items.length} листов из проектной и исполнительной документации. Нажмите на лист, чтобы открыть его крупно.`;
const groups=['Все'].concat([...new Set(DOCS.items.map(d=>d.group))]);
let cur=(location.hash||'').slice(1); cur=decodeURIComponent(cur); if(!groups.includes(cur)) cur='Все';
function render(){
  filters.innerHTML=groups.map(g=>`<button type="button" aria-pressed="${g===cur}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.g;history.replaceState(null,'','#'+encodeURIComponent(cur));render()});
  const it=DOCS.items.filter(d=>cur==='Все'||d.group===cur);
  grid.innerHTML=it.map((d,i)=>`<button type="button" class="doc" data-i="${DOCS.items.indexOf(d)}"><span class="th"><img loading="lazy" src="${esc(src(d.thumb))}" alt=""></span><span class="tx"><span class="t">${esc(d.title)}</span><span class="s">${esc(d.src)}</span><span class="tag">${esc(d.group)}</span></span></button>`).join('');
  grid.querySelectorAll('.doc').forEach(b=>b.onclick=()=>open(+b.dataset.i));
}
// ---- viewer ----
const V=document.getElementById('viewer'), st=document.getElementById('vStage'), img=document.getElementById('vImg');
let k=1,x=0,y=0,last=null;
function setT(){img.style.transform=`translate(${x}px,${y}px) scale(${k})`}
function fit(){const r=st.getBoundingClientRect(),w=img.naturalWidth||1,h=img.naturalHeight||1;k=Math.min(r.width/w,r.height/h);x=(r.width-w*k)/2;y=(r.height-h*k)/2;setT()}
function zoom(f,cx,cy){const nk=Math.min(6,Math.max(.05,k*f));f=nk/k;x=cx-(cx-x)*f;y=cy-(cy-y)*f;k=nk;setT()}
function open(i){const d=DOCS.items[i];document.getElementById('vT').innerHTML=`${esc(d.title)}<span class="vs">${esc(d.src)}</span>`;img.onload=fit;img.src=src(d.img);img.alt=d.title;
  const dl=document.getElementById('vDl');dl.href=src(d.img);dl.setAttribute('download',String(d.img||'').split('/').pop());V.hidden=false;last=document.activeElement;document.getElementById('vX').focus()}
function close(){V.hidden=true;img.removeAttribute('src');if(last)last.focus()}
document.getElementById('vDl').addEventListener('click',e=>{
  if(!(window.claude&&typeof window.claude.use==='function')) return;      // a normal link works outside Claude
  e.preventDefault(); const a=e.currentTarget, name=a.getAttribute('download');
  window.claude.use('downloads').then(dl=>{
    if(!dl){if(window.T14Site)T14Site.toast('Скачивание здесь недоступно: откройте лист и сохраните картинку');return}
    fetch(a.href).then(r=>r.blob()).then(b=>dl.save({filename:name,data:b})).catch(err=>{if(!err||err.code!=='declined'){if(window.T14Site)T14Site.toast('Не удалось сохранить файл')}});
  });
});
document.getElementById('vX').onclick=close; document.getElementById('vFit').onclick=fit;
document.getElementById('vIn').onclick=()=>{const r=st.getBoundingClientRect();zoom(1.5,r.width/2,r.height/2)};
document.getElementById('vOut').onclick=()=>{const r=st.getBoundingClientRect();zoom(1/1.5,r.width/2,r.height/2)};
document.addEventListener('keydown',e=>{if(!V.hidden&&e.key==='Escape')close()});
st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoom(Math.pow(1.0016,-e.deltaY),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const P=new Map(); let pinch=null;
st.addEventListener('pointerdown',e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});st.setPointerCapture(e.pointerId);st.classList.add('drag');
  if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}});
st.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const p=P.get(e.pointerId),nx=e.clientX,ny=e.clientY;
  if(P.size===2&&pinch){P.set(e.pointerId,{x:nx,y:ny});const [a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect();zoom(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pinch.d=d;return}
  x+=nx-p.x;y+=ny-p.y;P.set(e.pointerId,{x:nx,y:ny});setT()});
const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size)st.classList.remove('drag')};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
window.addEventListener('resize',()=>{if(!V.hidden)fit()});
render();
const q=new URLSearchParams(location.search).get('open'); if(q){const i=DOCS.items.findIndex(d=>d.id===q); if(i>=0) open(i)}
})();
</script>
