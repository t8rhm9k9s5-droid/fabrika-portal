<title>Фабрика — календарь ППР</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="assets/site.css">
<style>
/* «Календарь ППР» (Производство → Оборудование) — 14.11.2026, Т. В.: «незнакомый документ — проанализировать… сделать календарь на портале
   с ППР и уведомления ответственным». Данные — график ППР и ТО (build/ppr/ppr_data.json, вшиваются при сборке): месяц → участки →
   оборудование → мероприятия, кто делает и сколько часов; электрооборудование (осмотр/ремонт и простой). Ежесменные и ежедневные
   проверки операторов — отдельной вкладкой (это чек-лист у станка, не план ремонтной службы). */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 2px -4px;padding:4px;border:0;background:none;color:var(--ios-blue);font:400 17px var(--f-body);cursor:pointer;text-decoration:none}
.back::before{content:"";width:10px;height:10px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;transform:rotate(45deg);margin:0 2px 0 4px;border-radius:1px}
.lead{color:var(--ios-2);margin:4px 0 0;font-size:15px;max-width:72ch}
.pp-st{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,159,10,.12);color:var(--ios-label);font-size:14px}
.pp-st b{color:#a35a00}
.pp-mon{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;padding:2px 0 6px;scrollbar-width:none}
.pp-mon::-webkit-scrollbar{display:none}
.pp-mon button{flex:none;border:0;border-radius:999px;padding:7px 13px;font:500 14px var(--f-body);background:var(--ios-fill);color:var(--ios-label);cursor:pointer}
.pp-mon button[aria-pressed=true]{background:var(--ios-blue);color:#fff}
.pp-seg{display:inline-flex;background:var(--ios-fill);border-radius:10px;padding:2px;margin:8px 0}
.pp-seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:500 13.5px var(--f-body);color:var(--ios-label);cursor:pointer}
.pp-seg button[aria-pressed=true]{background:var(--ios-group);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pp-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:10px 0 4px}
.pp-k div{background:var(--ios-group);border-radius:14px;padding:11px 13px;box-shadow:0 0 0 .5px var(--ios-sep)}
.pp-k b{display:block;font:600 22px/1.15 var(--f-body);color:var(--ios-label)}
.pp-k span{font-size:12.5px;color:var(--ios-2)}
.pp-h{font:600 13px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.01em;color:var(--ios-2);margin:20px 2px 8px}
.pp-sec{background:var(--ios-group);border-radius:16px;box-shadow:0 0 0 .5px var(--ios-sep);margin-bottom:10px;overflow:hidden}
.pp-sec>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center}
.pp-sec>summary::-webkit-details-marker{display:none}
.pp-sec>summary b{flex:1;min-width:0;font:600 15px var(--f-body);color:var(--ios-label)}
.pp-sec>summary small{color:var(--ios-2);font-size:13px;white-space:nowrap}
.pp-eq{padding:4px 16px 10px}
.pp-eq h4{margin:10px 0 4px;font:600 14px var(--f-body);color:var(--ios-label)}
.pp-a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:7px 0;border-top:.5px solid var(--ios-sep);font-size:14px}
.pp-a:first-of-type{border-top:0}
.pp-a span{color:var(--ios-label)}
.pp-a small{color:var(--ios-2);font-size:12.5px;text-align:right;white-space:nowrap}
.pp-a em{grid-column:1/-1;font-style:normal;color:var(--ios-2);font-size:12.5px}
.pp-docs{display:grid;gap:8px;margin-top:6px}
.pp-docs a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--ios-group);border-radius:14px;padding:12px 14px;color:var(--ios-label);text-decoration:none;box-shadow:0 0 0 .5px var(--ios-sep)}
.pp-docs a small{color:var(--ios-2)}
.pfoot{color:var(--ios-2);font-size:12.5px;margin:16px 2px 0;max-width:80ch}
/* 28.11.2026 — журнал ППР и отметки «выполнено / просрочено» (поручение P-067; вносит Сотрудник82 Ю. В. с ~10.12) */
.pp-mon button{display:inline-flex;align-items:center;gap:6px}
.pp-b{font:700 11.5px/1 var(--f-body);font-style:normal;min-width:18px;padding:3px 5px;border-radius:999px;background:#d70015;color:#fff;text-align:center}
.pp-mon button[aria-pressed=true] .pp-b{background:#fff;color:#c0271d}
.pp-k b{white-space:nowrap}
.pp-k .pp-kok b{color:#1f7a35}
.pp-k .pp-klate b{color:#c0271d}
.pp-jh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 2px 8px}
.pp-jh .pp-h{margin:0}
.pp-new{min-height:40px;padding:0 16px;font-size:15px;border-radius:999px}
.pp-cap{color:var(--ios-2);font-size:13px;margin:-2px 2px 8px}
.pp-note{padding:14px 16px;font-size:14px;color:var(--ios-label)}
.pp-note.bad{color:#c0271d}
.pp-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px}
.pp-in .ibtn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-size:16px}
.pp-in .pp-go{text-decoration:none}
.pp-jl{padding:0 16px}
.pp-jr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:12px 0;border-top:.5px solid var(--ios-sep)}
.pp-jr:first-child{border-top:0}
.pp-jd{font:600 15px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ios-label)}
.pp-jb{min-width:0;display:grid;gap:2px;font-size:14px}
.pp-jb>b{font:600 15px var(--f-body);color:var(--ios-label)}
.pp-jb>span{color:var(--ios-label)}
.pp-jb small{color:var(--ios-2);font-size:13px}
.pp-jb .pp-p{justify-self:start}
.pp-by{color:var(--ios-2);font-size:12.5px}
.pp-del,.pp-go,.pp-more{border:0;background:none;color:var(--ios-blue);font:500 14px var(--f-body);padding:6px 4px;cursor:pointer;border-radius:8px}
.pp-del:hover,.pp-go:hover,.pp-more:hover{background:var(--ios-fill)}
.pp-del:disabled{opacity:.5}
.pp-more{display:block;margin:2px 0 0 auto;padding:8px 12px}
.pp-mk{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px}
.pp-p{display:inline-block;font:600 12px/1.3 var(--f-body);padding:3px 9px;border-radius:999px;background:var(--ios-fill);color:var(--ios-label)}
.pp-p.ok{background:rgba(52,199,89,.16);color:#1f7a35}
.pp-p.late{background:rgba(255,59,48,.13);color:#c0271d}
.pp-mk .pp-go{padding:3px 6px;font-size:13.5px}
.pp-cok{color:#1f7a35}.pp-clate{color:#c0271d;font-weight:600}

  :root:not([data-theme="light"]) .pp-p.late,:root:not([data-theme="light"]) .pp-k .pp-klate b,:root:not([data-theme="light"]) .pp-clate,:root:not([data-theme="light"]) .pp-note.bad{color:#ff7a70}}
:root[data-theme="dark"] .pp-p.ok,:root[data-theme="dark"] .pp-k .pp-kok b,:root[data-theme="dark"] .pp-cok{color:#4cd964}
:root[data-theme="dark"] .pp-p.late,:root[data-theme="dark"] .pp-k .pp-klate b,:root[data-theme="dark"] .pp-clate,:root[data-theme="dark"] .pp-note.bad{color:#ff7a70}
/* окно записи: на телефоне — лист снизу, на широком экране — по центру */
.pp-dlg{border:0;padding:0;margin:auto;width:min(580px,calc(100% - 32px));max-height:min(90vh,920px);border-radius:22px;background:var(--ios-bg,#f2f2f7);color:var(--ios-label);box-shadow:0 24px 64px rgba(0,0,0,.28);overflow:hidden}
.pp-dlg::backdrop{background:rgba(0,0,0,.38)}
.pp-dlg[open]{animation:ppUp .22s ease-out}
@keyframes ppUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pp-dlg[open]{animation:none}}
.pp-dlg form{max-height:inherit;overflow:auto;overscroll-behavior:contain;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pp-dh{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px 6px;padding:14px 16px 10px;background:var(--ios-bg,#f2f2f7);border-bottom:.5px solid var(--ios-sep)}
.pp-dh b{font:600 17px var(--f-body);text-align:center}
.pp-x{justify-self:start;border:0;background:none;color:var(--ios-blue);font:400 17px var(--f-body);padding:6px 2px;cursor:pointer}
.pp-dlg .igroup{margin-top:12px}
.pp-dlg .ihdr{margin:18px 16px 6px}
.pp-dlg .ifield{align-items:center}
.pp-dlg .ifield[hidden],.pp-dlg [hidden]{display:none}
.pp-dlg .ifield textarea{min-height:64px;padding:12px 0}
.pp-dlg .ifield select{appearance:none;-webkit-appearance:none;text-overflow:ellipsis;background:none;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,var(--ios-2) 50%),linear-gradient(135deg,var(--ios-2) 50%,transparent 50%);background-position:calc(100% - 9px) 50%,calc(100% - 4px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.pp-dlg .ifield input:focus-visible,.pp-dlg .ifield select:focus-visible,.pp-dlg .ifield textarea:focus-visible,.pp-top input:focus-visible{outline:none}
.pp-dlg .ifield:focus-within,.pp-top:focus-within{box-shadow:inset 3px 0 0 var(--ios-blue)}
.pp-kr:focus-within{box-shadow:inset 3px 0 0 var(--ios-blue)}
.pp-x:focus-visible,.pp-add:focus-visible,.pp-rm:focus-visible,.pp-go:focus-visible,.pp-del:focus-visible,.pp-more:focus-visible,.pp-new:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}
.pp-kr{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:.5px solid var(--ios-sep);cursor:pointer;font-size:15px}
.pp-kr:first-child{border-top:0}
.pp-kr input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--ios-blue)}
.pp-kr small{display:block;color:var(--ios-2);font-size:13px;margin-top:2px}
.pp-kn{margin:0;padding:12px 16px;color:var(--ios-2);font-size:14px}
.pp-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 40px;align-items:center;border-top:.5px solid var(--ios-sep)}
.pp-top:first-child{border-top:0}
.pp-top input{min-width:0;border:0;background:none;color:var(--ios-label);font:400 16px var(--f-body);padding:13px 0 13px 16px;outline:none}
.pp-top input+input{border-left:.5px solid var(--ios-sep);padding-left:12px}
.pp-rm{border:0;background:none;color:var(--ios-2);font:400 22px/1 var(--f-body);height:44px;cursor:pointer}
.pp-add{border:0;background:none;color:var(--ios-blue);font:500 15px var(--f-body);padding:10px 16px;cursor:pointer}
.pp-act{display:grid;margin-top:16px}
.pp-dlg .imsg{margin:12px 16px 0}
@media (max-width:600px){
  .pp-dlg{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:94vh}
  .pp-dlg .ifield>span{width:104px;font-size:15px}
}
</style>
<main class="ios" id="ppr">
  <a class="back" href="razdel.html#prod">Производство</a>
  <h1>Календарь и журнал ППР</h1>
  <p class="lead">Планово-предупредительный ремонт и ТО оборудования: что по плану в выбранном месяце — по участкам, оборудованию и исполнителям, и журнал ППР: что сделано, кем, доливки и pH.</p>
  <div id="ppView"></div>
</main>
<dialog class="pp-dlg" id="ppDlg" aria-labelledby="ppDlgT">
  <form id="ppF" novalidate>
    <div class="pp-dh"><button type="button" class="pp-x" data-close>Отмена</button><b id="ppDlgT">Запись в журнал ППР</b><span></span></div>
    <div class="igroup iflds">
      <label class="ifield"><span>Дата работ</span><input type="date" name="d" required></label>
      <label class="ifield"><span>Месяц плана</span><select name="pm"></select></label>
      <label class="ifield"><span>Оборудование</span><select name="eq" required></select></label>
      <label class="ifield" hidden><span>Что именно</span><input name="eqx" maxlength="120" placeholder="Название оборудования или объекта"></label>
    </div>
    <p class="ihdr" id="ppKh" hidden>Что из графика выполнено</p>
    <div class="igroup" id="ppK" hidden></div>
    <div class="igroup iflds">
      <label class="ifield"><span>Вид работ</span><textarea name="w" rows="2" maxlength="600" placeholder="Например: замена масла, чистка фильтра"></textarea></label>
      <label class="ifield"><span>Исполнитель</span><input name="who" maxlength="120" list="ppWho" autocomplete="off" placeholder="Фамилия И. О."></label>
    </div>
    <datalist id="ppWho"></datalist>
    <p class="ihdr">Доливки — что и сколько</p>
    <div class="igroup" id="ppTop"></div>
    <button type="button" class="pp-add">+ Добавить доливку</button>
    <div class="igroup iflds">
      <label class="ifield"><span>pH</span><input name="ph" inputmode="decimal" maxlength="5" placeholder="например 7,2" autocomplete="off"></label>
      <label class="ifield"><span>Примечание</span><textarea name="n" rows="2" maxlength="600" placeholder="Замечания, что осталось сделать"></textarea></label>
    </div>
    <p class="imsg" id="ppMsg" role="status" aria-live="polite"></p>
    <div class="pp-act"><button type="submit" class="ibtn pri">Сохранить запись</button></div>
  </form>
</dialog>
<script id="ppr-data" type="application/json">__PPR__</script>
<script>
(function () {
  'use strict';
  /* 28.11.2026, Т. В. (поручение P-067, ответ Сотрудник1 А. В. 27.11): журнал ППР — дата, вид работ, исполнитель, доливки (что и сколько), pH,
     примечание; вносит Сотрудник82 Ю. В. примерно с 10.12. Запись сохраняется сама, без Claude: страница → скрипт бота «Фабрика» (acct.json,
     T14Acct.api: ppradd / pprlist / pprdel, PprJournal.gs) → Google-таблица под 1c@, лист «ppr». Отметки календаря — по записям журнала:
     пункт графика месяца с записью — «выполнено», месяц закончился без записи — «просрочено». Отметки считаются с J0 (начало журнала). */
  var D = {}; try { D = JSON.parse(document.getElementById('ppr-data').textContent); } catch (e) { D = {}; }
  var V = document.getElementById('ppView'), MN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  var now = new Date(Date.now() + 3 * 3600e3), M = now.getUTCMonth(), MODE = 'plan', Y = now.getUTCFullYear(), M0 = M;
  var J0 = '2026-12', EXTRA = { 'Очистные и септики': ['Выгребная яма у склада № 1'] };   // J0 — с какого месяца плана считать отметки
  try { var h = /m=(\d+)/.exec(location.hash); if (h) M = Math.max(0, Math.min(11, +h[1] - 1)); } catch (e) { }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n(x) { return String(Math.round(x * 10) / 10).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  var monthIn = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
  function numberForm(count, one, few, many) {
    var last = count % 10, two = count % 100;
    if (two >= 11 && two <= 14) return many;
    if (last === 1) return one;
    return last >= 2 && last <= 4 ? few : many;
  }
  function activity(count) { return numberForm(count, 'мероприятие', 'мероприятия', 'мероприятий'); }
  function rowsFor(m, mode) { return (D.rows || []).filter(function (r) { return mode === 'ops' ? /[SDW]/.test(r[7]) : r[4][m] > 0 && !/[SDW]/.test(r[7]); }); }
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  function pmOf(m) { return Y + '-' + pad(m + 1); }
  function today() { return now.getUTCFullYear() + '-' + pad(now.getUTCMonth() + 1) + '-' + pad(now.getUTCDate()); }
  function dm(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? m[3] + '.' + m[2] : esc(d); }
  // ключ пункта графика: участок | оборудование | мероприятие (электрооборудование — по названию), FNV-1a → base36
  function hk(s) { var x = 0x811c9dc5; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); }
  function kP(r) { return r._k || (r._k = hk('p|' + r[0] + '|' + r[1] + '|' + r[2])); }
  function kE(e) { return e._k || (e._k = hk('e|' + e[0])); }

  // ---- журнал: состояние и сервер
  var J = { st: 'idle', rows: [], can: false, me: '', err: '', at: 0, all: false }, IDX = {};
  function A() { return window.T14Acct; }
  function logged() { var a = A(); try { return !!(a && a.api && a.tok && a.tok()); } catch (e) { return false; } }
  function api(op, b) { var a = A(); if (!a || !a.api) return Promise.reject(new Error('Журнал работает в приложении «Фабрика» (сайт с паролем).')); b = b || {}; b.tok = a.tok(); return a.api(op, b); }
  function index() { IDX = {}; J.rows.forEach(function (r) { var P = IDX[r.pm] || (IDX[r.pm] = {}); (r.k || []).forEach(function (k) { (P[k] = P[k] || []).push(r); }); }); }
  function load() {
    if (!logged()) { J.st = 'nologin'; draw(); return; }
    if (J.st !== 'ok') J.st = 'load'; draw();
    api('pprlist', { y: String(Y) }).then(function (r) {
      J.rows = (r.rows || []).sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : (b.t || 0) - (a.t || 0); });
      J.can = !!r.can; J.me = r.me || ''; J.st = 'ok'; J.at = Date.now(); index(); draw();
    }, function (e) { J.st = J.st === 'ok' ? 'ok' : 'err'; J.err = e && e.message || 'Нет связи с сервером.'; draw(); });
  }
  // отметка пункта: null — не считаем (до начала журнала или журнал не загружен)
  function mark(key, m, times) {
    var pm = pmOf(m); if (J.st !== 'ok' || pm < J0) return null;
    var recs = (IDX[pm] || {})[key] || [], need = Math.max(1, times || 1);
    if (recs.length >= need) return { s: 'done', r: recs };
    if (m < M0) return { s: 'late', got: recs.length, need: need };
    if (m === M0) return { s: 'plan', got: recs.length, need: need };
    return { s: 'future' };
  }
  function lateIn(m) {
    if (J.st !== 'ok' || pmOf(m) < J0 || m >= M0) return 0;
    var c = 0;
    rowsFor(m, 'plan').forEach(function (r) { var x = mark(kP(r), m, r[4][m]); if (x && x.s === 'late') c++; });
    (D.el || []).forEach(function (e) { if (e[4][m]) { var x = mark(kE(e), m, 1); if (x && x.s === 'late') c++; } });
    return c;
  }
  function pill(x, key, m) {
    if (!x) return '';
    var b = J.can && x.s !== 'done' && x.s !== 'future' ? '<button type="button" class="pp-go" data-k="' + key + '" data-m="' + m + '">Отметить</button>' : '';

    if (ph && (!/^\d{1,2}(\.\d{1,2})?$/.test(ph) || +ph > 14)) return bad('pH — число от 0 до 14, например 7,2.', F.ph);
    var btn = F.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Сохраняю…'; MSG.textContent = ''; MSG.className = 'imsg';
    api('ppradd', { d: F.d.value, pm: F.pm.value, eq: eq, w: w, k: k, who: who, top: tops(), ph: ph, n: F.n.value.trim() }).then(function () {
      btn.disabled = false; btn.textContent = 'Сохранить запись'; dropDraft(); closeForm(); toast('Запись внесена в журнал ППР');
      var pm = F.pm.value; M = +pm.slice(5, 7) - 1; load();
    }, function (er) {
      btn.disabled = false; btn.textContent = 'Сохранить запись'; saveDraft();
      bad('Не сохранено: ' + String(er && er.message || 'нет связи с сервером').replace(/[.\s]+$/, '') + '. Запись осталась в форме — нажмите «Сохранить запись» ещё раз.');
    });
  });

  draw();
  function start() { load(); document.addEventListener('visibilitychange', function () { if (!document.hidden && (J.st !== 'ok' || Date.now() - J.at > 5 * 60e3)) load(); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0);
})();
</script>
